plugins {
    id 'com.android.application'
}

android {
    namespace 'com.echo.beyond'
    compileSdk 35

    signingConfigs {
        echoUpdate {
            storeFile file(System.getenv('ECHO_KEYSTORE_PATH'))
            storePassword System.getenv('ECHO_KEYSTORE_PASSWORD')
            keyAlias System.getenv('ECHO_KEY_ALIAS')
            keyPassword System.getenv('ECHO_KEY_PASSWORD')
        }
    }

    defaultConfig {
        applicationId 'com.echo.beyond'
        minSdk 26
        targetSdk 35
        versionCode (project.findProperty('versionCode') ?: '2').toInteger()
        versionName project.findProperty('versionName') ?: '0.2.0'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.echoUpdate
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
